name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment to apply when explicit_version is empty
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      explicit_version:
        description: Optional exact version like 0.2.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        shell: bash
        run: |
          if [[ -n "${{ inputs.explicit_version }}" ]]; then
            npm version "${{ inputs.explicit_version }}" -m "chore: release v%s"
          else
            npm version "${{ inputs.bump }}" -m "chore: release v%s"
          fi
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push branch and tag
        run: |
          git push origin HEAD
          git push origin "v${{ steps.bump.outputs.version }}"
